<header class="encabezado">
  <a routerLink="/" class="logo">🎬 Cine App</a>

  <nav class="nav">
    <a routerLink="/" routerLinkActive="activo" [routerLinkActiveOptions]="{exact: true}">Inicio</a>
    <a routerLink="/peliculas" routerLinkActive="activo">Películas</a>
    <a routerLink="/proximamente" routerLinkActive="activo">Próximamente</a>

    @if (sesion.usuarioActual(); as usuario) {
      <a routerLink="/mis-puntos" routerLinkActive="activo">Mis puntos</a>
      <a routerLink="/mis-peliculas" routerLinkActive="activo">Mis películas</a>
      @if (sesion.esAdmin()) {
        <a routerLink="/admin" routerLinkActive="activo">Admin</a>
      }
      <span class="saludo">Hola, {{ usuario.nombre }}</span>
      <button (click)="sesion.cerrarSesion()" class="boton-salir">Salir</button>
    } @else {
      <a routerLink="/login" routerLinkActive="activo">Ingresar</a>
      <a routerLink="/registro" routerLinkActive="activo">Registrarme</a>
    }
  </nav>
</header>
